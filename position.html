<!DOCTYPE html>
<html lang="it">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Aloa</title>
    <link rel="stylesheet" href="reset.css">
    <!-- Inserire qui altri collegamenti a fogli di stile css per le librerie -->
    <link rel="stylesheet" href="style.css">

  </head>
  <body>
    <h1>Position</h1>

    <h2>static</h2>

    <div class="container-6">
      <div class="box">1</div>
      <div class="box">2</div>
      <div class="box">3</div>
      <div class="box">4</div>
    </div>

    <h2>relative</h2>

    <div class="container-6">
      <div class="box">1</div>
      <div class="box relative">2</div>
      <div class="box">3</div>
      <div class="box">4</div>
    </div>

    <h2>absolute</h2>

    <div class="container-6">
      <div class="box">1</div>
      <div class="box absolute">2</div>
      <div class="box">3</div>
      <div class="box">4</div>
    </div>

    <h2>sticky</h2>

    <div class="container-6">
      <div class="box">1</div>
      <div class="box sticky">2</div>
      <div class="box">3</div>
      <div class="box">4</div>
    </div>

    <h2>fixed</h2>

    <div class="container-6">
      <div class="box">1</div>
      <div class="box fixed">2</div>
      <div class="box">3</div>
      <div class="box">4</div>
    </div>

    <h2>elemento absolute in container relative</h2>

    <div class="container-7">
      <div class="box">1</div>
      <div class="box">2</div>
      <div class="box absolute">3</div>
      <div class="box">4</div>
    </div>



  </body>
</html>
